<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white flex items-center justify-center min-h-screen">

<div class="w-full max-w-2xl bg-slate-900 rounded-2xl flex flex-col h-[85vh] shadow-xl">

    <!-- HEADER -->
    <div class="p-4 border-b border-slate-700 text-center">
        <h1 class="text-2xl font-bold text-cyan-400">
            AI Business Assistant
        </h1>
    </div>

    <!-- CHAT BOX -->
    <div id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-3">
    </div>

    <!-- INPUT AREA -->
    <div class="p-4 border-t border-slate-700 flex gap-2">

        <input
            id="chatMsg"
            type="text"
            placeholder="Ask anything..."
            class="flex-1 p-3 rounded-lg bg-slate-800 text-white outline-none border border-slate-700"
            onkeydown="if(event.key==='Enter') sendChat()"
        />

        <button
            id="sendBtn"
            class="bg-cyan-500 hover:bg-cyan-600 px-5 py-3 rounded-lg font-semibold"
        >
            Send
        </button>

    </div>

</div>

<script>

document.getElementById("sendBtn").addEventListener("click", sendChat);

async function sendChat() {

    const input = document.getElementById("chatMsg");
    const chatBox = document.getElementById("chatBox");

    const message = input.value.trim();

    if (!message) return;

    // User message
    chatBox.innerHTML += `
        <div class="text-right">
            <div class="inline-block bg-cyan-600 px-4 py-2 rounded-lg">
                ${message}
            </div>
        </div>
    `;

    input.value = "";

    chatBox.scrollTop = chatBox.scrollHeight;

    try {

        const response = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Server Error");
        }

        // AI reply
        chatBox.innerHTML += `
            <div class="text-left">
                <div class="inline-block bg-slate-800 px-4 py-2 rounded-lg border border-slate-700">
                    ${data.reply}
                </div>
            </div>
        `;

    } catch (error) {

        console.error(error);

        chatBox.innerHTML += `
            <div class="text-left">
                <div class="inline-block bg-red-600 px-4 py-2 rounded-lg">
                    Server Error: ${error.message}
                </div>
            </div>
        `;
    }

    chatBox.scrollTop = chatBox.scrollHeight;
}

</script>

</body>
</html>
