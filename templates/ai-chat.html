<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white flex items-center justify-center min-h-screen">

<div class="w-full max-w-2xl bg-slate-900 rounded-2xl flex flex-col h-[85vh]">

    <div class="p-4 border-b border-slate-700 text-center">
        <h1 class="text-xl font-bold text-cyan-400">AI Chat</h1>
    </div>

    <!-- CHAT BOX -->
    <div id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-2"></div>

    <!-- INPUT -->
    <div class="p-3 flex gap-2 border-t border-slate-700">

        <input id="chatMsg"
               class="flex-1 p-3 rounded bg-slate-800 text-white"
               placeholder="Type message..."
               onkeydown="if(event.key==='Enter') sendChat()" />

        <button id="sendBtn"
                class="bg-cyan-500 px-5 py-2 rounded font-bold">
            Send
        </button>

    </div>

</div>

<!-- IMPORTANT: JS MUST BE INLINE FOR TEST -->
<script>
document.getElementById("sendBtn").addEventListener("click", sendChat);

async function sendChat() {

    const input = document.getElementById("chatMsg");
    const box = document.getElementById("chatBox");

    const msg = input.value.trim();
    if (!msg) return;

    // user message
    box.innerHTML += `<div><b>You:</b> ${msg}</div>`;
    input.value = "";

    try {
        const res = await fetch("https://ai-powered02.vercel.app/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: msg })
        });

        const data = await res.json();

        box.innerHTML += `<div><b>AI:</b> ${data.reply}</div>`;
        box.scrollTop = box.scrollHeight;

    } catch (err) {
        console.error(err);
        box.innerHTML += `<div style="color:red;">Server Error</div>`;
    }
}
</script>

</body>
</html>
